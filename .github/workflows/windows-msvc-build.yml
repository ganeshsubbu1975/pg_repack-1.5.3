name: Windows MSVC build (PostgreSQL 18, built from source)

on:
  workflow_dispatch:
  push:

env:
  PGROOT: C:\pg18
  PG_VERSION: 18.0
  REPACK_VERSION: 1.5.3

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools (meson, ninja, bison, flex)
        shell: pwsh
        run: |
          python -m pip install --quiet meson ninja
          choco install winflexbison3 --yes --no-progress
          meson --version

      - name: Download PostgreSQL source
        shell: pwsh
        run: |
          $v = $env:PG_VERSION
          Invoke-WebRequest "https://ftp.postgresql.org/pub/source/v$v/postgresql-$v.tar.gz" -OutFile pg.tar.gz
          tar -xzf pg.tar.gz
          Rename-Item "postgresql-$v" pgsrc

      - name: Build and install PostgreSQL (headers and libs)
        shell: cmd
        run: |
          cd pgsrc
          meson setup build --prefix=%PGROOT% --buildtype=release -Dnls=disabled -Dssl=none -Dzlib=disabled -Dicu=disabled -Dreadline=disabled -Dlz4=disabled -Dzstd=disabled -Dtap_tests=disabled
          if errorlevel 1 exit /b 1
          meson compile -C build
          if errorlevel 1 exit /b 1
          meson install -C build
          if errorlevel 1 exit /b 1

      - name: Locate PostgreSQL libraries
        shell: pwsh
        run: |
          Get-ChildItem $env:PGROOT\lib -Recurse | Select-Object -ExpandProperty FullName
          function Find-Lib($pattern) {
            $f = Get-ChildItem pgsrc\build, $env:PGROOT -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match $pattern } | Select-Object -First 1
            if (-not $f) { throw "library matching $pattern not found" }
            $f.FullName
          }
          $common = Find-Lib '^(lib)?pgcommon\.(lib|a)$'
          $port   = Find-Lib '^(lib)?pgport\.(lib|a)$'
          $pq     = Find-Lib '^libpq\.lib$'
          $pgexe  = Find-Lib '^postgres\.lib$'
          "PGCOMMON_LIB=$common" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PGPORT_LIB=$port"     | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LIBPQ_LIB=$pq"        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "POSTGRES_LIB=$pgexe"  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "common=$common port=$port pq=$pq postgres=$pgexe"

      - name: Build pg_repack.exe and pg_repack.dll
        shell: cmd
        run: |
          mkdir dist
          set INC=/I"%PGROOT%\include" /I"%PGROOT%\include\server" /I"%PGROOT%\include\server\port\win32_msvc" /I"%PGROOT%\include\server\port\win32" /I"%PGROOT%\include\internal"
          set DEFS=/DREPACK_VERSION=%REPACK_VERSION% /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN

          rem ---- client: pg_repack.exe
          cl /nologo /O2 /MD /Fe:dist\pg_repack.exe %DEFS% /DFRONTEND %INC% /I bin /I . ^
             bin\pg_repack.c bin\pgut\pgut.c bin\pgut\pgut-fe.c ^
             /link "%LIBPQ_LIB%" "%PGCOMMON_LIB%" "%PGPORT_LIB%" ws2_32.lib secur32.lib advapi32.lib shell32.lib user32.lib bcrypt.lib crypt32.lib
          if errorlevel 1 exit /b 1

          rem ---- server extension: pg_repack.dll
          cl /nologo /O2 /MD /LD /Fe:dist\pg_repack.dll %DEFS% %INC% /I lib /I . ^
             lib\repack.c lib\pgut\pgut-spi.c ^
             /link "%POSTGRES_LIB%" ws2_32.lib
          if errorlevel 1 exit /b 1

      - name: Generate extension SQL and control files
        shell: pwsh
        run: |
          $v = $env:REPACK_VERSION
          (Get-Content lib/pg_repack.sql.in -Raw) -replace 'REPACK_VERSION',$v -replace 'relhasoids','false' |
            Set-Content -NoNewline "dist/pg_repack--$v.sql"
          (Get-Content lib/pg_repack.control.in -Raw) -replace 'REPACK_VERSION',$v |
            Set-Content -NoNewline dist/pg_repack.control
          Copy-Item "$env:PGROOT\bin\libpq.dll" dist\
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: pg_repack-1.5.3-windows-x64-pg18
          path: dist/
